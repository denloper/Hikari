appId: com.hikari.desktop
productName: Hikari
copyright: Personal use
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/@ghostery/**/*
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  shortcutName: Hikari
  artifactName: Hikari-Setup-${version}.exe
  uninstallDisplayName: Hikari
electronLanguages:
  - ru
  - en
publish:
  provider: github
  owner: denloper
  repo: Hikari
  releaseType: release
